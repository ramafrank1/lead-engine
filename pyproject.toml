[project]
name = "lead-engine"
version = "0.1.0"
description = "Sistema de captación de clientes para el negocio de páginas web de Ramiro Frank"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "psycopg[binary]>=3.2",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
lead = "lead_engine.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
